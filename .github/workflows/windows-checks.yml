name: Windows Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra gui --extra captcha

      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --no-sync python -B -X utf8 -m unittest discover -s tests -v

      - name: Command-line smoke check
        run: uv run --no-sync python -B -X utf8 AutoCourse.py --help
